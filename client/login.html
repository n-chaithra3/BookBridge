<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Login - BookBridge</title><link rel="stylesheet" href="css/style.css"></head>
<body><nav id="nav"></nav>
<div class="login"><h2 id="heading">Welcome back</h2><p id="sub">Login to buy or sell books on BookBridge</p>
<div id="nameBox" style="display:none"><label>Full Name</label><input id="name" placeholder="Your name"></div>
<label>College Email</label><input id="email" placeholder="student@college.edu">
<label>Password</label><input id="password" type="password" placeholder="At least 6 characters">
<a class="btn" style="text-align:center;cursor:pointer" id="go" onclick="submitForm()">Login</a>
<div class="msg" id="msg"></div>
<p style="margin:16px 0 0;text-align:center"><span id="switchText">New here?</span> <b style="color:#1e3a5f;cursor:pointer" id="switchLink" onclick="toggle()">Create an account</b></p></div>
<script src="js/api.js"></script>
<script>
let registering = false;
function toggle() {
  registering = !registering;
  nameBox.style.display = registering ? 'block' : 'none';
  heading.textContent = registering ? 'Create account' : 'Welcome back';
  go.textContent = registering ? 'Register' : 'Login';
  switchText.textContent = registering ? 'Already registered?' : 'New here?';
  switchLink.textContent = registering ? 'Login' : 'Create an account';
  msg.textContent = '';
}
async function submitForm() {
  try {
    if (registering) {
      await api('/api/auth/register', { method: 'POST', body: JSON.stringify({ name: name.value, email: email.value, password: password.value }) });
      toggle(); msg.style.color = '#2d6a3e'; msg.textContent = 'Account created. Please login.';
    } else {
      const data = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email: email.value, password: password.value }) });
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify({ name: data.name, role: data.role }));
      location.href = 'books.html';
    }
  } catch (err) {
    msg.style.color = '#b42318'; msg.textContent = err.message;
  }
}
</script></body></html>
